name: CodeQL

# Analyse de sécurité du JavaScript par GitHub. Signale les motifs
# exploitables : injection dans le DOM, redirections ouvertes,
# expressions régulières vulnérables au déni de service.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Tous les lundis à 06:00 UTC — attrape les vulnérabilités
    # publiées après la fusion.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
